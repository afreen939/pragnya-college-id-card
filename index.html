
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My College ID Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card-container">
        <div class="id-card">
            <header class="card-header">
                <img src="images/logo.png" class="logo" alt="College Logo">
                <p>PRAGNYA DEGREE COLLEGE</p>
            </header>

            <div class="photo-wrap">
                <img src="images/photo.jpg" alt="Profile Photo" class="photo">
            </div>

            <main class="card-body">
                <div class="name-section">
                    <h2 class="student-name">Afreen</h2>
                    <p class="college">Pragnya Degree College</p>
                </div>

                <hr class="divider">

                <div class="details">
                    <p><strong>Course:</strong> BCA</p>
                    <p><strong>Date of Birth:</strong> XX-XX-XXXX</p>
                </div>

                <div class="id-line">
                    <span class="id-label">ID No.:</span>
                    <span class="id-value">BCA2026001</span>
                </div>

                <div class="barcode"></div>
            </main>

            <footer class="card-footer">
                <p class="footer-text">Issued by: Pragnya Degree College</p>
            </footer>
        </div>
    </div>
</body>

</html>
